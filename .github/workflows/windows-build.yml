name: Windows build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  VCPKG_DEFAULT_TRIPLET: x64-windows

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Flex and Bison
        run: choco install winflexbison3 --no-progress -y

      - name: Install SDL2, SDL2_image and Boost.Filesystem (vcpkg)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install sdl2 sdl2-image boost-filesystem --triplet x64-windows
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          "SDL2DIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows" >> $env:GITHUB_ENV
          "SDL2IMAGEDIR=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows" >> $env:GITHUB_ENV

      # Boost 1.84 removed boost::filesystem::path::is_complete(); piranha (pinned upstream) still calls it once.
      # is_absolute() is the documented replacement. Local builds against Boost 1.84+ need the same one-line change.
      - name: Patch piranha for Boost 1.84+
        shell: pwsh
        run: |
          $f = "dependencies/submodules/piranha/src/path.cpp"
          (Get-Content $f) -replace 'is_complete\(\)', 'is_absolute()' | Set-Content $f
          Select-String -Path $f -Pattern 'is_absolute' | ForEach-Object { $_.Line }

      - name: Configure
        shell: pwsh
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DDISCORD_ENABLED=OFF `
            -DBoost_USE_STATIC_LIBS=ON `
            -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE

      - name: Build
        run: |
          cmake --build build --config ${{ env.BUILD_TYPE }} --target engine-sim-app
          cmake --build build --config ${{ env.BUILD_TYPE }} --target engine-sim-headless
          cmake --build build --config ${{ env.BUILD_TYPE }} --target engine-sim-test

      # the 1-D exhaust's unit and network tests (Sod and blowdown shock tubes against the exact solution, junctions,
      # port boundary conservation and convergence). Upstream's own gas-system, function and synthesizer tests fail,
      # crash or hang on this tree, as on the exhaust-1d head before it (docs/exhaust-1d.md, section 4), so they are
      # left out here.
      - name: 1-D exhaust tests
        shell: pwsh
        run: |
          $t = Get-ChildItem -Recurse -Filter engine-sim-test.exe build | Select-Object -First 1
          & $t.FullName --gtest_filter='Pipe1DTests.*:ExhaustNetworkTests.*'
          if ($LASTEXITCODE -ne 0) { throw "1-D exhaust tests failed: $LASTEXITCODE" }

      - name: Package
        shell: pwsh
        run: |
          $out = "package/engine-sim-arcindweld"
          New-Item -ItemType Directory -Force -Path "$out/bin" | Out-Null
          $exe = Get-ChildItem -Recurse -Filter engine-sim-app.exe build | Select-Object -First 1
          Copy-Item $exe.FullName "$out/bin/"
          $hl = Get-ChildItem -Recurse -Filter engine-sim-headless.exe build | Select-Object -First 1
          Copy-Item $hl.FullName "$out/bin/"
          # runtime DLLs vcpkg copied next to the exe (SDL2, SDL2_image and their dependencies)
          Get-ChildItem -Path $exe.DirectoryName -Filter *.dll | Copy-Item -Destination "$out/bin/"
          Copy-Item -Recurse assets "$out/assets"
          Copy-Item -Recurse es "$out/es"
          New-Item -ItemType Directory -Force -Path "$out/basic" | Out-Null
          Copy-Item -Recurse dependencies/submodules/delta-studio/engines/basic/shaders "$out/basic/shaders"
          Copy-Item -Recurse dependencies/submodules/delta-studio/engines/basic/fonts "$out/basic/fonts"
          Copy-Item -Recurse dependencies/submodules/delta-studio/dependencies/runtime/x64/* "$out/bin/" -ErrorAction SilentlyContinue
          # Visual C++ runtime next to the exe, as the upstream release ships it (msvcp140, vcruntime140, vcruntime140_1)
          $crt = Get-ChildItem -Path "C:/Program Files/Microsoft Visual Studio/2022/*/VC/Redist/MSVC/*/x64/Microsoft.VC143.CRT" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($crt) { Get-ChildItem -Path $crt.FullName -Filter *.dll | Copy-Item -Destination "$out/bin/" } else { Write-Warning "VC143 CRT redist not found" }
          Set-Content -Path "$out/bin/delta.conf" -Value "../basic`n../assets" -NoNewline
          Copy-Item LICENSE "$out/"
          Get-ChildItem -Recurse $out | Select-Object -ExpandProperty FullName | Out-File package/files.txt

      # the headless runner on a shipped engine: it must compile, run and write a sound file
      - name: Headless smoke test
        shell: pwsh
        run: |
          Push-Location package/engine-sim-arcindweld
          # assets/main.mr is the app's own entry file (imports the default engine and calls main())
          & bin/engine-sim-headless.exe assets/main.mr --sim 3 --hold-rpm 3000 --gain 0.35 --wav ../smoke.wav --json ../smoke.json
          if ($LASTEXITCODE -ne 0) { throw "headless run failed: $LASTEXITCODE" }
          Pop-Location
          Get-Content package/smoke.json -Raw
          "{0:N0} bytes of sound" -f (Get-Item package/smoke.wav).Length

      # the 1-D exhaust on the calculator's test engine (test/data/exhaust_tuner_i4.mr, a 4-1 header): it must pick the
      # 1-D model, run without NaN, make torque and keep its mass account
      - name: Headless 1-D smoke test
        shell: pwsh
        run: |
          Copy-Item test/data/exhaust_tuner_i4.mr package/engine-sim-arcindweld/smoke_i4.mr
          Push-Location package/engine-sim-arcindweld
          & bin/engine-sim-headless.exe smoke_i4.mr --sim 3 --hold-rpm 6000 --no-audio --json ../smoke1d.json
          $rc = $LASTEXITCODE
          Remove-Item smoke_i4.mr
          Pop-Location
          if ($rc -ne 0) { throw "headless 1-D run failed: $rc" }
          $j = Get-Content package/smoke1d.json -Raw | ConvertFrom-Json
          if ($j.exhaust[0].legacy) { throw "the test engine ran the legacy exhaust" }
          if ($j.sim.nan) { throw "NaN in the 1-D run" }
          if ($j.sim.mean_dyno_torque_Nm -lt 50) { throw ("1-D torque too low: {0} N m" -f $j.sim.mean_dyno_torque_Nm) }
          foreach ($m in $j.sim.mass) {
            if ($m -and [math]::Abs($m.error_rel_to_throughput) -gt 1e-6) { throw ("1-D mass account off: {0}" -f $m.error_rel_to_throughput) }
          }
          "1-D: {0:N1} N m at {1:N0} rpm on {2} cells" -f $j.sim.mean_dyno_torque_Nm, $j.sim.mean_rpm, $j.total_cells

      - uses: actions/upload-artifact@v4
        with:
          name: engine-sim-windows-x64
          path: package/
